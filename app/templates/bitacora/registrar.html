{% extends 'base.html' %}

{% block title %}
    Registrar entrada
{% endblock %}

{% block content %}

<h1>Registrar entrada de bitácora</h1>

<form method="POST">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <h2>Datos de acceso</h2>

    <div>
        <label for="fecha">
            Fecha
        </label>

        <input
            type="date"
            id="fecha"
            name="fecha"
            required
        >
    </div>

    <br>

    <div>
        <label for="hora_entrada">
            Hora de entrada
        </label>

        <input
            type="time"
            id="hora_entrada"
            name="hora_entrada"
            required
        >
    </div>

    <br>

    <div>
        <label for="soporte">
            Soporte
        </label>

        <input
            type="text"
            id="soporte"
            name="soporte"
            value="Facilities"
            required
        >
    </div>

    <br>

    <div>
        <label for="empresa">
            Empresa
        </label>

        <input
            type="text"
            id="empresa"
            name="empresa"
            maxlength="150"
            required
        >
    </div>

    <br>

    <div>
        <label for="actividad">
            Actividad
        </label>

        <input
            type="text"
            id="actividad"
            name="actividad"
            required
        >
    </div>

    <br>

    <h2>Ubicación</h2>

    <div>
        <label for="nave_id">
            Nave
        </label>

        <select
            name="nave_id"
            id="nave_id"
            required
        >
            <option value="">
                Seleccionar nave
            </option>

            {% for nave in naves %}

                <option value="{{ nave.id }}">
                    {{ nave.codigo }}
                </option>

            {% endfor %}

        </select>
    </div>

    <br>

    <div>
        <label for="area_id">
            Área
        </label>

        <select
            name="area_id"
            id="area_id"
            required
            disabled
        >
            <option value="">
                Selecciona primero una nave
            </option>

            {% for area in areas %}

                <option value="{{ area.id }}">
                    {{ area.nave.codigo }}
                    -
                    {{ area.nombre }}
                </option>

            {% endfor %}

        </select>
    </div>

    <br>

    <div>
        <label for="bitacora_lectora">
            Bitácora lectora
        </label>

        <input
            type="text"
            name="bitacora_lectora"
            id="bitacora_lectora"
            value="Bitacora"
            required
        >
    </div>

    <br>

    <h2>Requerimientos</h2>

    <div>
        <label for="codigo_requerimiento">
            IR / RR / CR
        </label>

        <input
            type="text"
            id="codigo_requerimiento"
            name="codigo_requerimiento"
            placeholder="Ejemplo: CR21308038"
            maxlength="20"
            required
        >

        <p>
            CR = Cambio |
            IR = Incidente |
            RR = Ticket
        </p>
    </div>

    <br>

    <div>
        <label for="argonite_anexo1">
            Argonite / Anexo 01
        </label>

        <select
            name="argonite_anexo1"
            id="argonite_anexo1"
            required
        >
            <option value="NO">
                NO
            </option>

            <option value="SI">
                SI
            </option>
        </select>
    </div>

    <br>

    <h2>Personal</h2>

        <div>
            <label>Personal:</label>

            <input
                type="text"
                name="personal"
                maxlength="150"
                required
            >
        </div>

    <br>

    <div>
        <label for="auditor_id">
            Auditoría
        </label>

        <select
            name="auditor_id"
            id="auditor_id"
            required
        >
            <option value="">
                Seleccionar auditor
            </option>

            {% for auditor in auditores %}

                <option value="{{ auditor.id }}">
                    {{ auditor.nombre }}
                </option>

            {% endfor %}

        </select>
    </div>

    <br>

    <div>
        <label for="amonestacion">
            Amonestación
        </label>

        <input
            type="number"
            id="amonestacion"
            name="amonestacion"
            value="0"
            min="0"
        >
    </div>

    <br>

    <div>
        <label for="comentario">
            Comentario
        </label>

        <textarea
            id="comentario"
            name="comentario"
            rows="4"
        ></textarea>
    </div>

    <br>

    <button type="submit">
        Registrar Entrada
    </button>

</form>

<br>

<a href="{{ url_for('bitacora.index') }}">
    Regresar
</a>

<script>

    const naveSelect =
        document.getElementById("nave_id");

    const areaSelect =
        document.getElementById("area_id");


    naveSelect.addEventListener(
        "change",
        async function() {

            const naveId = this.value;

            areaSelect.innerHTML = "";

            areaSelect.disabled = true;


            if (!naveId) {

                const option =
                    document.createElement("option");

                option.value = "";

                option.textContent =
                    "Selecciona primero la nave";

                areaSelect.appendChild(option);

                return;
            }


            const response = await fetch(
                `/bitacora/api/areas/${naveId}`
            );


            if (!response.ok) {

                alert(
                    "No fue posible cargar las áreas."
                );

                return;
            }


            const areas =
                await response.json();


            const defaultOption =
                document.createElement("option");

            defaultOption.value = "";

            defaultOption.textContent =
                "Seleccionar área";

            areaSelect.appendChild(
                defaultOption
            );


            areas.forEach(area => {

                const option =
                    document.createElement("option");

                option.value = area.id;

                option.textContent =
                    area.nombre;

                areaSelect.appendChild(
                    option
                );

            });


            areaSelect.disabled = false;

        }
    );

</script>

{% endblock %}
