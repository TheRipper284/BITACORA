{% extends 'base.html' %}

{% block title %}
    Registrar entrada
{% endblock %}

{% block content %}
    <h1>Registar entrada de bitácora</h1>

    <form method="POST">
        <h2>Datos de acceso</h2>

        <div>
            <label for="fecha">
                Fecha
            </label>
            <input 
                type="date"
                id="fecha"
                name="fecha"
                required
            >
        </div>

        <br>

        <div>
            <label for="hora_entrada">
                Hora de entrada
            </label>
            <input 
                type="time"
                id="hora_entrada"
                name="hora_entrada"
                required
            >
        </div>

        <br>

        <div>
            <label for="soporte">
                Soporte
            </label>
            <input 
                type="text"
                id="soporte"
                name="soporte"
                value="Facilities"
                required
            >
        </div>

        <br>

        <div>
            <label for="empresa_id">
                Emmpresa
            </label>
            <select name="empresa_id" id="empresa_id" required>
                <option value="">
                    Selecionar empresa
                </option>

                {% for empresa in empresas %}

                <option value="{{ empresa.id }}">
                    {{ empresa.nombre }}
                </option>

                {% endfor %}

            </select>
        </div>

        <br>

        <div>
            <label for="actividad">
                Acticvidad
            </label>
            <input 
                type="text"
                id="actividad"
                name="actividad"
                required
            >
        </div>

        <br>

        <h2>Ubicación</h2>

        <div>
            <label for="nave_id">
                Nave
            </label>
            <select name="nave_id" id="nave_id" required>
                <option value="">
                    Seleccionar nave
                </option>

                {% for nave in naves %}

                    <option value="{{ nave.id }}">
                        {{ nave.codigo }}
                    </option>

                {% endfor %}
            </select>
        </div>

        <br>

        <div>
            <label for="area_id">
                Área
            </label>
            <select name="area_id" id="area_id" required>
                <option value="">
                    Seleccinar área
                </option>

                {% for area in areas %}

                    <option value="{{ area.id }}">
                        {{ area.nave.codigo }}
                        -
                        {{ area.nombre }}
                    </option>

                {% endfor %}
            </select>
        </div>

        <br>

        <div>
            <label for="bitacora_lectora">
                Bitácora lectora
            </label>
            <input 
                type="text" 
                name="bitacora_lectora" 
                id="bitacora_lectora"
                required
            >
        </div>

        <br>

        <h2>Requerimientos</h2>

        <div>
            <label for="codigo_requerimiento">
                IR / RR / CR
            </label>
            <input 
                type="text" 
                id="codigo_requerimiento"
                name="codigo_requerimiento"
                placeholder="Ejemplo: CR21308038"
                maxlength="20"
                required
            >
            <p>
                CR = Cambio |
                IR = Incidente |
                RR = Ticket
            </p>
        </div>

        <br>

        <div>
            <label>
                Argonite / Anexo 01
            </label>
            <select name="argonite_anexo1" required>
                <option value="NO">
                    NO
                </option>

                <option value="SI">
                    SI
                </option>
            </select>
        </div>

        <br>

        <h2>Personal</h2>

        <div>
            <label for="personal_id">
                Personal
            </label>
            <select 
                id="personal_id"
                name="personal_id"
                required
            >
                <option value="">
                    Seleccionar personal
                </option>

                {% for persona in personal %}

                    <option value="{{ persona.id }}">
                        {{ persona.nombre }}
                    </option>
                
                {% endfor %}

            </select>
        </div>

        <br>

        <div>
            <label for="auditor_id">
                Auditoria
            </label>
            <select name="auditor_id" id="auditor_id" required>
                <option value="">
                    Seleccionar auditor
                </option>

                {% for auditor in auditores %}
                    <option value="{{ auditor.id }}">
                        {{ auditor.nombre }}
                    </option>
                {% endfor %}

            </select>
        </div>

        <br>

        <div>
            <label for="amonestacion">
                Amonestación
            </label>
            <input 
                type="text" 
                id="amonestacion"
                name="amonestacion"
                value="0"
                min="0"
            >
        </div>

        <br>

        <div>
            <label for="comentario">
                Comentario
            </label>
            <textarea 
                id="comentario"
                name="comentario"
                rows="4"
            ></textarea>
        </div>

        <br>

        <button type="submit">
            Registrar Entrada
        </button>

    </form>

    <br>

    <a href="{{ url_for('bitacora.index') }}">
        Regresar
    </a>
    
{% endblock %}
