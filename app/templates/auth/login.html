{% extends 'base.html' %}

{% block title %}
Iniciar sesión
{% endblock %}

{% block content %}

<h1>Bitácora</h1>

<h2>Iniciar sesión</h2>

<form method="POST">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <div>
        <label for="usuario">
            Usuario
        </label>

        <input 
            type="text"
            id="usuario"
            name="usuario"
            required
            autocomplete="username"
        >
    </div>

    <br>

    <div>
        <label for="password">
            Contraseña
        </label>

        <input 
            type="password"
            id="password"
            name="password"
            required
            autocomplete="current-password"
        >
    </div>

    <br>

    <button type="submit">
        Iniciar sesión
    </button>

</form>

{% endblock %}
