{% extends 'base.html' %}

{% block title %}
Iniciar sesión
{% endblock %}

{% block body_class %}login-page{% endblock %}
{% block page_class %}page--centered{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/auth.css') }}">
{% endblock %}

{% block content %}

<div class="login-container">
    <h1 class="login-heading">Bitácora</h1>
    <p class="login-subheading">Control de acceso · Iniciar sesión</p>

    <form method="POST" class="login-form">
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <input
            type="text"
            id="usuario"
            name="usuario"
            class="login-input"
            placeholder="Usuario"
            required
            autocomplete="username"
        >

        <input
            type="password"
            id="password"
            name="password"
            class="login-input"
            placeholder="Contraseña"
            required
            autocomplete="current-password"
        >

        <button type="submit" class="login-button">
            Iniciar sesión
        </button>
    </form>
</div>

{% endblock %}
